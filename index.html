<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starter HTML</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #1f2937;
      }

      main {
        width: min(680px, 92vw);
        padding: 2rem;
        border-radius: 16px;
        background: white;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      h1 {
        margin-top: 0;
        font-size: 2rem;
      }

      p {
        line-height: 1.6;
      }

      button {
        margin-top: 1rem;
        padding: 0.8rem 1.2rem;
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-size: 1rem;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, HTML</h1>
      <p>Your starter page is ready. Edit this file to build your page.</p>
      <button id="demo-button">Click me</button>
    </main>

    <script>
      document.getElementById('demo-button').addEventListener('click', function () {
        alert('Your HTML starter is working.');
      });
    </script>
  </body>
</html>
